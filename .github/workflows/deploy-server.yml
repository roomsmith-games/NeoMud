name: Deploy Game Server to Staging

on:
  push:
    branches: [master]
    paths:
      - 'server/**'
      - 'shared/**'
      - 'Dockerfile'
      # World content lives outside server/** but is packaged into the
      # docker image via :server:packageWorld. Without this path the
      # game server stays stuck on stale world data when only zone JSONs
      # or assets change (Phase 8C 3c1c139 first surfaced this).
      - 'maker/default_world_src/**'
  # Manual dispatch — needed to retro-deploy when a content-only push
  # didn't match the path filter at the time it landed, or to redeploy
  # an unchanged build (e.g., env var rotation).
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: "[1/8] Run tests"
        run: |
          echo "[1/8] Running tests..."
          ./gradlew packageWorld --rerun-tasks
          ./gradlew :shared:jvmTest :server:test --no-daemon
          echo "[1/8] ✓ All tests passed"

  deploy-server:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: "[2/8] Clean and build"
        run: |
          echo "[2/8] Clean building..."
          ./gradlew clean
          ./gradlew packageWorld --rerun-tasks
          ./gradlew :server:shadowJar --no-daemon
          echo "[2/8] ✓ Build complete"

      - name: "[3/8] Verify build artifacts"
        run: |
          echo "[3/8] Verifying artifacts..."
          ls -lh server/build/libs/neomud-server.jar || { echo "[3/8] ✗ FATAL: shadowJar not found"; exit 1; }
          ls -lh server/build/worlds/default-world.nmd || { echo "[3/8] ✗ FATAL: world bundle not found"; exit 1; }
          echo "[3/8] ✓ Artifacts verified"

      - name: "[4/8] Log in to GHCR"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "[5/8] Build and push Docker image"
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/neomud-server:latest
            ghcr.io/${{ github.repository_owner }}/neomud-server:sha-${{ github.sha }}

      - name: "[6/8] Deploy Docker image to VPS"
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY_STAGING }}
          script: |
            echo "[6/8] Pulling new game server image..."
            docker pull ghcr.io/${{ github.repository_owner }}/neomud-server:latest
            docker image prune -f
            echo "[6/8] ✓ Image ready"

      - name: "[7/8] Upload seed bundle (first-boot safety net)"
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY_STAGING }}
          source: "server/build/worlds/default-world.nmd"
          target: /srv/neomud-assets/
          strip_components: 3
          overwrite: true

      - name: "[8/8] Publish world via API + verify"
        env:
          STAGE_API: https://stage-api.neomud.app
          ADMIN_EMAIL: ${{ secrets.STAGE_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.STAGE_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          VERSION=$(jq -r .version maker/default_world_src/manifest.json)
          CHANGELOG="CI publish from $(echo '${{ github.sha }}' | head -c 7)"

          echo "Publishing default-world v${VERSION}..."

          # 1) Authenticate (retry up to 3× on rate-limit 429)
          TOKEN=""
          for attempt in 1 2 3; do
            LOGIN_RESP=$(curl -sS -w '\n%{http_code}' -X POST "$STAGE_API/api/v1/auth/login" \
              -H "Content-Type: application/json" \
              -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\"}")
            LOGIN_HTTP=$(echo "$LOGIN_RESP" | tail -1)
            LOGIN_BODY=$(echo "$LOGIN_RESP" | sed '$d')
            if [ "$LOGIN_HTTP" = "200" ]; then
              TOKEN=$(echo "$LOGIN_BODY" | jq -r '.accessToken')
              break
            fi
            if [ "$LOGIN_HTTP" = "429" ] && [ "$attempt" -lt 3 ]; then
              WAIT=$(echo "$LOGIN_BODY" | jq -r '.retryAfterSeconds // 60')
              echo "  Rate limited, waiting ${WAIT}s (attempt $attempt/3)..."
              sleep "$WAIT"
            else
              echo "❌ Login failed (HTTP $LOGIN_HTTP): $LOGIN_BODY"
              exit 1
            fi
          done
          [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ] || { echo "❌ Login failed after retries"; exit 1; }
          echo "✓ Authenticated"

          # 2) Resolve world ID from slug
          WORLD_ID=$(curl -fsS "$STAGE_API/api/v1/worlds/default-world" \
            | jq -r '.id')
          [ -n "$WORLD_ID" ] && [ "$WORLD_ID" != "null" ] || { echo "❌ World not found"; exit 1; }
          echo "✓ World ID: $WORLD_ID"

          # 3) Publish version (uploads bundle, retires old, auto-starts)
          HTTP_CODE=$(curl -sS -o /tmp/publish-response.json -w '%{http_code}' \
            -X POST "$STAGE_API/api/v1/worlds/$WORLD_ID/versions" \
            -H "Authorization: Bearer $TOKEN" \
            -F "version=$VERSION" \
            -F "changelog=$CHANGELOG" \
            -F "bundle=@server/build/worlds/default-world.nmd")
          if [ "$HTTP_CODE" = "409" ]; then
            echo "⚠ Version $VERSION already exists — skipping to verify"
          elif [ "$HTTP_CODE" -ge 400 ]; then
            echo "❌ Publish failed (HTTP $HTTP_CODE):"
            cat /tmp/publish-response.json
            exit 1
          else
            echo "✓ Published: $(jq -c '{id,version,checksum}' /tmp/publish-response.json)"
          fi

          # 4) Poll until game server is ONLINE (150s timeout)
          echo "Waiting for game server..."
          for i in $(seq 1 30); do
            STATUS=$(curl -fsS "$STAGE_API/api/v1/worlds/default-world" \
              | jq -r '.serverStatus // "UNKNOWN"')
            if [ "$STATUS" = "ONLINE" ]; then
              echo "✅ Game server ONLINE — v${VERSION} deployed"
              exit 0
            fi
            echo "  [$i/30] serverStatus=$STATUS"
            sleep 5
          done
          echo "⚠️ Game server not ONLINE after 150s (status=$STATUS)"
          exit 1
