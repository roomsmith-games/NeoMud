name: Deploy Maker to Staging

on:
  push:
    branches: [master]
    paths:
      - 'maker/**'
  # Manual dispatch — see NeoMud-Platform/.github/workflows/deploy.yml
  # comment for rationale. Needed here too since the path filter above
  # blocks push-triggers that don't touch maker/ (e.g. workflow-only edits).
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy-maker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: "[1/5] Log in to GHCR"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "[2/5] Build and push maker image"
        uses: docker/build-push-action@v6
        with:
          context: ./maker
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/neomud-maker:latest
            ghcr.io/${{ github.repository_owner }}/neomud-maker:sha-${{ github.sha }}

      - name: "[3/5] Deploy to staging"
        uses: appleboy/ssh-action@v1
        env:
          # GH Actions secrets → SSH session env → upserted into maker.env
          # on the VPS. Source of truth is GitHub; the VPS file is derived.
          # Empty values skip the upsert so absent secrets don't write
          # placeholder lines.
          BETTER_STACK_MAKER_TOKEN: ${{ secrets.BETTER_STACK_MAKER_TOKEN }}
          BETTER_STACK_MAKER_HOST: ${{ secrets.BETTER_STACK_MAKER_HOST }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY_STAGING }}
          envs: BETTER_STACK_MAKER_TOKEN,BETTER_STACK_MAKER_HOST
          script: |
            echo "[3/5] Pulling and recreating maker..."
            docker pull ghcr.io/${{ github.repository_owner }}/neomud-maker:latest
            cd ~/neomud-staging
            # Idempotent env upsert: replace existing key or append. Skips
            # on empty value so unset secrets don't clobber .env content.
            # Any write failure (permission, sed, append) returns non-zero
            # so callers can exit — silent skips here produced a green-looking
            # deploy with stale env during 6.pre rollout.
            upsert_env() {
              local file=$1 key=$2 value=$3
              if [ -z "$value" ]; then
                echo "upsert_env: skipping $key (empty/unset)"
                return 0
              fi
              if ! touch "$file" 2>/dev/null; then
                echo "✗ upsert_env: cannot write to $file (permission?)" >&2
                return 1
              fi
              if grep -q "^${key}=" "$file"; then
                # Delete-and-append instead of sed with a delimiter: secrets
                # (especially base64 tokens) can contain any sed delimiter
                # char. Two-step is bullet-proof regardless of value content.
                grep -v "^${key}=" "$file" > "$file.tmp" \
                  && printf '%s=%s\n' "$key" "$value" >> "$file.tmp" \
                  && mv "$file.tmp" "$file" \
                  || { echo "✗ upsert_env: replace failed for $key in $file" >&2; rm -f "$file.tmp"; return 1; }
              else
                echo "${key}=${value}" >> "$file" || { echo "✗ upsert_env: append failed for $key in $file" >&2; return 1; }
              fi
            }
            upsert_env maker.env BETTER_STACK_TOKEN "$BETTER_STACK_MAKER_TOKEN" || exit 1
            upsert_env maker.env BETTER_STACK_HOST "$BETTER_STACK_MAKER_HOST" || exit 1
            docker compose up -d --force-recreate --no-deps maker-stg
            echo "[3/5] ✓ Maker container recreated"

      - name: "[4/5] Verify maker health"
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY_STAGING }}
          script: |
            echo "[4/5] Waiting for maker to start..."
            sleep 10
            docker ps --filter name=maker-stg --format '{{.Status}}' | grep -q healthy && echo "[4/5] ✓ Maker container healthy" || echo "[4/5] ⚠ Maker still starting"

      - name: "[5/5] Verify staging URL"
        run: |
          sleep 5
          curl -sf https://stage-maker.neomud.app/ -o /dev/null && echo "[5/5] ✓ Maker accessible at https://stage-maker.neomud.app/" || { echo "[5/5] ✗ Maker not accessible"; exit 1; }
